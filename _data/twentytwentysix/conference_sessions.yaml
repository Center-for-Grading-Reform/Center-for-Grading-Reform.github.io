- slot: 3.1
  day: 3
  time: "11:00 AM --- 12:00 PM EDT"
  title: "Welcome Back & Keynote: Jesse Stommel"
  zoom: https://us06web.zoom.us/j/85364314767?pwd=1iAZX7lvOiQmiivqPIGkZeKkLoMl5H.1
  slides-static: https://docs.google.com/presentation/d/e/2PACX-1vQjv-NSCFX1MULeoOSh2e3jzisjgiI24RlRH2A5MnCLNj53vO37p6E8lA00EUW90LSsTxRDP5ie2BSM/pub
  keynote-title: 'Do We Need the Word "Ungrading"?'
  keynote-abstract: |
    I started ungrading in 2001, my first semester as instructor of record. Over the last 26 years, I have never put a grade on a piece of student work. While I’d used the word in workshops and talks as early as 2003, I first explicitly published about “ungrading” in an October 2017 piece titled <a href="https://www.jessestommel.com/why-i-dont-grade/">“Why I Don’t Grade,”</a> where I wrote, “Grades are currency for a capitalist system that reduces teaching and learning to a mere transaction. Grading is a massive co-ordinated effort to take humans out of the educational process.” In that piece, I “withheld the mechanics of ungrading deliberately, because I agree with <a href="https://www.alfiekohn.org/article/trouble-rubrics/">Alfie Kohn</a> who writes, ‘When the how’s of assessment preoccupy us, they tend to chase the why’s back into the shadows.’”

    My own definition of the term has evolved, but I’ve consistently argued that it’s problematic to reduce ungrading to a zeitgeist, a trendy set of decontextualized best practices. There is no neat and tidy thing we can all do tomorrow to obliterate grades. That simply isn’t the system, culture, or labor conditions that many of us work within. Different approaches work for different teachers in different disciplines in different ways at different times. This is why I’ve repeatedly defined ungrading as “raising an eyebrow at grades as a systemic practice, distinct from simply ‘not grading.’ The word is a present participle, an ongoing process, not a static set of practices.” Some have suggested that the word “ungrading” is a misnomer, because most students are still getting final grades, but I’d say it’s the exact right word to describe the two key components of my definition: (1) an active and ongoing critique of grades as a system and (2) the decision to do what we can, depending on our labor conditions, to carefully dismantle that system.

