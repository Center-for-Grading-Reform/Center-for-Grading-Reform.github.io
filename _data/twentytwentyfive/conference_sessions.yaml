- slot: 1.2
  day: 1
  time: "12:00 --- 1:00 PM EDT"
  title: "Keynote: Asao Inoue"
  keynote-title: "On Liking and Labor in Writing Assessment: A Journey Toward Labor-Based Grading"
  keynote-abstract: |
    In this keynote, Dr. Asao B. Inoue shares a personal and reflective journey toward labor-based grading in college writing classrooms, offering stories and insights that invite educators to rethink how assessment works and for whom. Rather than prescribing a method, he traces key moments from his teaching and mentoring life that reveal the deep connections between grading, languaging, and justice. Through classroom experiences, student conferences, and transformative mentorship from scholars like Peter Elbow, he explores how traditional grading often undermines the very relationships and learning conditions that help students grow.

    At the center of the talk is a deceptively simple idea: liking students' writing matters. Dr. Inoue argues that centering labor—the effort students put into their work—rather than outcomes alone, offers a more ethical, equitable, and humane foundation for classroom assessment. Along the way, he challenges assumptions about fairness, rigor, and standards, showing how grading systems can either reinforce or resist larger patterns of injustice. This keynote offers not a solution, but an invitation: to imagine classroom spaces where judgment is shared, where risk and joy are possible, and where both students and teachers can truly their languaging.

