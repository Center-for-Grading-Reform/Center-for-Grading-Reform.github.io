- slot: 3.1
  day: 3
  time: "11:00 AM --- 12:00 PM EDT"
  title: "Welcome Back & Keynote: Jeff Anderson"
  keynote-title: "Letter grades cause learning cancer… What might we do instead?"
  keynote-abstract: |
    What would you say about a medical industry that requires doctors to prescribe cigarettes to patients while claiming this practice is a necessary part of health care? Of course, we might be disgusted by such a requirement. We expect doctors, hospitals, and the entire medical industry to be familiar with research that shows the link between cigarettes and cancer. Sadly, we have no comparable expectations for teachers and schools when it comes to letter grades. 

    As a society, we have 100+ years of scientific research that documents that letter grades cause learning cancer. However, far too many teachers, administrators, and institutions are completely unaware of this research. In fact, we work in a system that requires teachers to put learning cigarettes into the mouths of our students. 

    In this talk, we explore ideas about what we might do instead. Specifically, we invite participants to develop your identity as research educators so you can learn to map every decision you make about teaching policies back to empirically validated, research-based theories of learning that justify those decisions. We also think about institutional changes that might better support such a shift away from systems that uphold wealth supremacy towards schools that support learning.

