- slot: 2.1
  day: 2
  time: "11:00 AM --- 12:00 PM EDT"
  title: "Welcome Back & Keynote: Eden Tanner"
  keynote-title: "General Chemistry as a Gateway Course through Alternative Grading"
  keynote-abstract: |
    What happens when you tell a group of 150 first year college students that they can take their exams an unlimited number of times?  Dr. Eden Tanner&mdash;a tenure track assistant professor of Chemistry and Biochemistry at the University of Mississippi&mdash;will share her experiences of alternative grading in general chemistry, with a particular focus on re-testing. She’ll share the highs&mdash;and lows&mdash;of her journey so far, the impact this has had on her students, and her broader quest to reimagine large introductory STEM classes as “gateway” courses to STEM careers.

